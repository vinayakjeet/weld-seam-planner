name: ci

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # Chromium runs every spec on every push. On main the load, pick, export, isolation and reach specs also run in
  # Firefox and WebKit (playwright.config.ts picks the specs for each project).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        if: matrix.browser == 'chromium' || github.ref == 'refs/heads/main'
      - uses: actions/setup-node@v4
        if: matrix.browser == 'chromium' || github.ref == 'refs/heads/main'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: matrix.browser == 'chromium' || github.ref == 'refs/heads/main'
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: matrix.browser == 'chromium' || github.ref == 'refs/heads/main'
      - run: npx playwright test --project=${{ matrix.browser }}
        if: matrix.browser == 'chromium' || github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results
